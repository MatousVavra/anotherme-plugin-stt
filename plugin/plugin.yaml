name: stt
version: 0.3.0
description: Speech-to-text via Whisper
author: AnotherMe
entrypoint: plugin
capabilities:
  - routes
  - ui
soft_dependencies:
  - name: memory
    enables: "speaker name correction in transcripts"
ui:
  icon: mic
  order: 999
  component: true
settings:
  - key: model
    label: "Whisper model"
    type: text
    default: "whisper-large-v3"
    description: "STT model name"
tables: []
